name: keep-alive

# Prevents Supabase free-tier auto-pause (7 days idle) and Render free-tier
# sleep by hitting the backend health endpoint every 3 days. $0.
on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        run: curl -fsS --max-time 120 "${{ vars.HEALTH_URL }}" || curl -fsS --max-time 120 "${{ vars.HEALTH_URL }}"
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
# Set repo variable HEALTH_URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://your-service.onrender.com/health. The retry handles Render's ~60s cold start.
