services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asdr
      POSTGRES_PASSWORD: asdr
      POSTGRES_DB: asdr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asdr -d asdr"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env (see .env.example)}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      DATABASE_URL: postgresql+psycopg://asdr:asdr@db:5432/asdr
      CLIENT_COMPANY_NAME: ${CLIENT_COMPANY_NAME:-Apex Digital}
      CHROMA_PATH: /data/chroma
      KB_SEED_FILE: ./mock_kb.txt
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      GMAIL_USER_EMAIL: ${GMAIL_USER_EMAIL:-}
      MAIL_MODE: ${MAIL_MODE:-hitl}
      MAIL_POLL_INTERVAL: ${MAIL_POLL_INTERVAL:-30}
      CHATBOT_URL: ${CHATBOT_URL:-http://localhost:3000/chat}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      BUSINESS_NAME: ${BUSINESS_NAME:-Apex Digital LLC}
      BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-600 Congress Ave, Austin, TX 78701}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
    volumes:
      - chroma_data:/data/chroma
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  chroma_data:
