# Render blueprint: backend web service ONLY.
# Postgres + Auth now live on Supabase free tier (Render's free Postgres
# auto-expires after ~30-90 days — not safe for production data).
# Deploy: Render dashboard → New → Blueprint → point at this repo.
# Then set DATABASE_URL to your Supabase connection string (SUPABASE_DATABASE_URL).
services:
  - type: web
    name: asdr-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # Supabase Postgres connection string (supabase.com → Settings → Database)
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_COMPANY_NAME
        value: Apex Digital
      - key: CHROMA_PATH
        value: /data/chroma
      - key: KB_SEED_FILE
        value: ./mock_kb.txt
      - key: CORS_ORIGINS
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_USER_EMAIL
        sync: false
      - key: MAIL_MODE
        value: hitl
      - key: MAIL_POLL_INTERVAL
        value: "30"
      - key: CHATBOT_URL
        value: http://localhost:3000/chat
      # SaaS shell
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_SCALE
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: BUSINESS_NAME
        value: Apex Digital LLC
      - key: BUSINESS_ADDRESS
        value: 600 Congress Ave, Austin, TX 78701
      - key: PUBLIC_API_URL
        sync: false
      - key: WEB_URL
        sync: false
    disk:
      name: chroma-data
      mountPath: /data/chroma
      sizeGB: 1
